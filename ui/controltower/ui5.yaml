specVersion: "3.1"
metadata:
  name: vstower.controltower
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: true
        backend:
          - path: /sap
            url: http://REPLACE-WITH-YOUR-S4-HOST:PORT
            client: "REPLACE-CLIENT"
    - name: fiori-tools-appreload
      afterMiddleware: compression
